<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Power BI Internal Report</title>
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.1/lib/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/powerbi-client/2.19.1/powerbi.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        #reportContainer { width: 100%; height: 800px; border: 1px solid #ccc; margin-top: 20px; display: none; background: white; }
        button { padding: 10px 20px; cursor: pointer; background: #0078d4; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #005a9e; }
        input { padding: 9px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        
        /* Style cho Chatbox */
        #ai-chat-btn { position: fixed; bottom: 30px; right: 30px; padding: 15px 25px; border-radius: 30px; background: #0078d4; color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; cursor: pointer; z-index: 9999; font-size: 16px; }
        #chat-window { display: none; flex-direction: column; position: fixed; bottom: 90px; right: 30px; width: 380px; height: 500px; background: white; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); z-index: 9999; font-family: 'Segoe UI', sans-serif; }
        .chat-header { background: #0078d4; color: white; padding: 15px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; font-weight: bold; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f3f2f1; display: flex; flex-direction: column; gap: 10px; }
        .chat-footer { padding: 10px; background: white; display: flex; gap: 5px; border-top: 1px solid #ccc; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .msg-user { align-self: flex-end; background: #0078d4; color: white; border-bottom-right-radius: 2px; }
        .msg-ai { align-self: flex-start; background: #e1dfdd; color: #333; border-bottom-left-radius: 2px; }
        #chat-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Hệ thống Báo cáo Nội bộ</h2>
        <div id="loginSection">
            <input type="text" id="dbUsername" placeholder="Nhập Username hệ thống">
            <button onclick="handleLoginSystem()">1. Xác thực hệ thống</button>
            <button id="btnMS" onclick="loginMicrosoft()" style="display:none; background: #2b88d8;">2. Đăng nhập Microsoft</button>
        </div>
        <p id="status"></p>
    </div>

    <div id="reportContainer"></div>

    <button id="ai-chat-btn" onclick="toggleChat()">🤖 AI Trợ lý</button>

    <div id="chat-window">
        <div class="chat-header">
            <span>AI Phân tích Dữ liệu</span>
            <span onclick="toggleChat()" style="cursor: pointer;">&times;</span>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="msg msg-ai">Chào bạn! Tôi có thể phân tích dữ liệu bán hàng trong khu vực của bạn.</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Hỏi chi tiết (VD: Doanh thu tháng này?)...">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script src="authConfig.js"></script>
    <script src="fetchAPI.js"></script> 

    <script>
        // Cấu hình Power BI
        const config = {
            clientId: "34a9a012-370d-41aa-bb37-c41653513164", 
            tenantId: "972bd407-5501-469b-a60c-1cb78484a366",
            workspaceId: "ae08f768-cc64-477b-803e-70d078110f50",
            reportId: "93adc194-7c13-44a9-99fc-80bce22d0d50" 
        };

        // Khởi tạo MSAL (Lấy config từ file authConfig.js nếu có, hoặc dùng inline)
        // Để an toàn, ở đây tôi dùng config inline để khớp với code cũ của bạn
        const msalInstance = new msal.PublicClientApplication({
            auth: {
                clientId: config.clientId,
                authority: `https://login.microsoftonline.com/${config.tenantId}`,
                redirectUri: "http://localhost:5500" 
            }
        });

        // --- 1. XỬ LÝ LOGIN HỆ THỐNG (Đã sửa để dùng fetchAPI.js) ---
        async function handleLoginSystem() {
            const username = document.getElementById('dbUsername').value;
            try {
                // Gọi hàm loginToSystem từ file fetchAPI.js
                // Thay vì viết fetch thủ công ở đây
                const data = await loginToSystem(username);
                
                if (data.success) {
                    // LƯU TOKEN VÀO SESSION (Quan trọng cho AI)
                    sessionStorage.setItem('app_token', data.access_token);
                    
                    // Lưu thông tin user
                    localStorage.setItem('dbUserInfo', JSON.stringify(data.user_info));
                    
                    // Cập nhật giao diện
                    document.getElementById('status').innerText = "✅ Hệ thống đã nhận diện: " + data.user_info.db_username;
                    document.getElementById('btnMS').style.display = "inline";
                    alert("Đăng nhập thành công!");
                } else {
                    alert("Username không tồn tại trong SQL!");
                }
            } catch (err) {
                console.error("Lỗi:", err);
                alert("Lỗi kết nối tới Server.");
            }
        }

        // --- 2. XỬ LÝ LOGIN MICROSOFT ---
        async function loginMicrosoft() {
            try {
                await msalInstance.loginRedirect({
                    scopes: ["https://analysis.windows.net/powerbi/api/Report.Read.All"]
                });
            } catch (err) { console.error(err); }
        }

        msalInstance.handleRedirectPromise().then(response => {
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                msalInstance.acquireTokenSilent({
                    account: accounts[0],
                    scopes: ["https://analysis.windows.net/powerbi/api/Report.Read.All"]
                }).then(authResult => renderReport(authResult.accessToken));
            }
        });

        // --- 3. RENDER REPORT & RLS ---
        async function renderReport(token) {
            const models = window['powerbi-client'].models;
            const container = document.getElementById('reportContainer');
            container.style.display = "block";

            const storedUser = JSON.parse(localStorage.getItem('dbUserInfo'));
            if (!storedUser) return;

            let reportFilters = [];

            if (storedUser.db_username.toLowerCase() !== 'admin') {
                if (storedUser.customer_types && storedUser.customer_types.length > 0) {
                    reportFilters.push({
                        $schema: "http://powerbi.com/product/schema#basic",
                        target: { table: "dim_customer_type", column: "Customer_Type_Name" },
                        operator: "In",
                        values: storedUser.customer_types
                    });
                }
                if (storedUser.regions && storedUser.regions.length > 0) {
                    reportFilters.push({
                        $schema: "http://powerbi.com/product/schema#basic",
                        target: { table: "Dim_Geography", column: "province" },
                        operator: "In",
                        values: storedUser.regions 
                    });
                }
                reportFilters.push({
                    $schema: "http://powerbi.com/product/schema#basic",
                    target: { table: "Dim_User_Access", column: "username" },
                    operator: "In",
                    values: [storedUser.db_username]
                });
            }

            const embedConfig = {
                type: 'report',
                tokenType: models.TokenType.Aad,
                accessToken: token,
                embedUrl: `https://app.powerbi.com/reportEmbed?reportId=${config.reportId}&groupId=${config.workspaceId}`,
                id: config.reportId,
                filters: reportFilters,
                settings: { filterPaneEnabled: false, navContentPaneEnabled: true }
            };

            const report = powerbi.embed(container, embedConfig);

            report.on("loaded", async () => {
                if (reportFilters.length > 0) {
                    try {
                        await report.setFilters(reportFilters);
                        console.log("✅ Đã khóa dữ liệu theo:", storedUser.db_username);
                    } catch (err) { console.error("Lỗi áp filter:", err); }
                }
            });
        }

        // --- 4. CHAT AI LOGIC ---
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const msgBox = document.getElementById('chat-messages');
            const question = input.value.trim();
            if (!question) return;

            // Kiểm tra Token
            const token = sessionStorage.getItem('app_token');

            console.log("Token đang gửi đi:", token);
            if (!token) {
                alert("Vui lòng đăng nhập hệ thống (Bước 1) trước!");
                return;
            }

            msgBox.innerHTML += `<div class="msg msg-user">${question}</div>`;
            input.value = '';
            
            const loading = document.createElement('div');
            loading.className = 'msg msg-ai';
            loading.innerText = 'Đang tính toán...';
            msgBox.appendChild(loading);
            msgBox.scrollTop = msgBox.scrollHeight;

            try {
                // Gọi hàm từ fetchAPI.js (Giờ đã hoạt động vì đã nhúng file)
                const data = await askAIAnalyst(question, token);
                loading.innerText = data.reply || "Không có dữ liệu trả về.";
            } catch (err) {
                loading.innerText = "Lỗi kết nối Server!";
                console.error(err);
            }
            msgBox.scrollTop = msgBox.scrollHeight;
        }

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
